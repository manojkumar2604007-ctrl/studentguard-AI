<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}StudentGuard AI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">&#127891; StudentGuard <span>AI</span></a>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('assess') }}">Assessment</a>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('analytics') }}">Analytics</a>
  </nav>
</header>
<main class="container">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>StudentGuard AI &middot; Student Dropout Prediction using an Artificial Neural Network</footer>
</body>
</html>
